services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_saas
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: erp
      DB_PASSWORD: erp
      DB_NAME: erp_saas
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - '6432:5432'
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: ['node', 'dist/worker.js']
    env_file: .env
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
