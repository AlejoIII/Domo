name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging-backend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and build API
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: domo-api-staging
          path: |
            dist
            package.json
            package-lock.json
            prisma

