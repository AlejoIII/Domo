name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E smoke (login page)
        run: npm run test:e2e
        env:
          CI: true

  e2e-critical:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_saas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_saas_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      DATABASE_URL: postgresql://erp:erp@localhost:5432/erp_saas_e2e?schema=public
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      E2E_BACKEND_PATH: erp-saas-backend

    steps:
      - uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/erp-saas-backend
          path: erp-saas-backend

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            erp-saas-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: erp-saas-backend
        run: npm ci

      - name: Build backend
        working-directory: erp-saas-backend
        run: |
          npx prisma generate
          npm run build

      - run: npm ci
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E critical (login → order → payment)
        run: npm run test:e2e:critical
